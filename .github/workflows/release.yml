name: release
# A tag vX.Y.Z is a release products can pin. It must pass the tests on every OS first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must match the crate version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but Cargo.toml says $v"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
      - name: Tell the products a new tag exists
        # Optional: with a token that may dispatch to the product's repository, its nuah-update workflow runs now
        # instead of at its next scheduled run.
        env:
          GH_TOKEN: ${{ secrets.PRODUCTS_DISPATCH_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "no PRODUCTS_DISPATCH_TOKEN; products pick the tag up on their schedule"; exit 0; }
          for repo in addaui/madar; do
            gh api "repos/$repo/dispatches" -f event_type=nuah-released -f "client_payload[tag]=${GITHUB_REF_NAME}"
          done
