<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuah setup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">Nuah setup</div>
    <label for="name">Profile name</label>
    <input id="name" autocomplete="off" maxlength="60">
    <span class="spacer"></span>
    <span id="path" class="muted"></span>
    <button id="save" class="primary" type="button" disabled>Save profile</button>
  </header>
  <main>
    <section id="problems" aria-live="polite"></section>
    <section id="first" hidden>
      <h2>First administrator</h2>
      <p class="muted">The person who signs in first and can add the others. The password is stored hashed; you can change it later.</p>
      <div class="bind"><label for="first-name">Name</label><input id="first-name" autocomplete="username" maxlength="200"></div>
      <div class="bind"><label for="first-pass">Password</label><input id="first-pass" type="password" autocomplete="new-password" maxlength="1000"> <span class="muted">at least 8 characters</span></div>
    </section>
    <section id="bindings"></section>
    <section id="plugins"></section>
  </main>
  <div id="gate" class="gate" hidden>
    <form id="gate-form">
      <h1>Setup code</h1>
      <p>The server printed a code when it started. Type it here to continue.</p>
      <input id="code" autocomplete="off" spellcheck="false" aria-label="Setup code">
      <p id="gate-msg" class="muted" role="alert"></p>
      <button class="primary" type="submit">Continue</button>
    </form>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
