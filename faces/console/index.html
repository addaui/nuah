<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuah console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><strong>Nuah console</strong><span id="who" class="muted"></span><span class="grow"></span><input id="find" type="search" placeholder="Filter operations" aria-label="Filter operations"><button id="out" hidden>Sign out</button></header>
<main>
  <section id="signin" hidden><h2>Sign in</h2><form id="form"><input name="name" placeholder="Name" autocomplete="username" aria-label="Name"><input name="password" type="password" placeholder="Password" autocomplete="current-password" aria-label="Password"><button class="primary">Sign in</button><span id="err" class="err" role="alert"></span></form></section>
  <section id="app" hidden>
    <div id="accounts-box" hidden><h2>Accounts</h2><div id="accounts"></div><form id="newacct"><input name="name" placeholder="New account name" aria-label="New account name"><input name="password" type="password" placeholder="Password (8+ characters)" autocomplete="new-password" aria-label="Password"><input name="roles" placeholder="roles, comma separated" value="member" aria-label="Roles"><button class="primary">Create</button><span id="acct-err" class="err" role="alert"></span></form></div>
    <div id="config-box" hidden><h2>Configuration</h2><p class="muted" id="config-path"></p><div id="config"></div><div class="bar"><button id="config-save" class="primary">Save</button><button id="config-restart" hidden>Restart now</button><span id="config-msg" role="status"></span></div></div>
    <div class="cols"><div><h2>Plugins</h2><ul id="plugins"></ul><h2>Extension points</h2><div id="points"></div><h2>Events</h2><div id="events" class="muted"></div></div>
    <div><h2>Operations</h2><div id="ops"></div></div>
    <div><h2>Live <span id="live" class="dot"></span></h2><pre id="pulse"></pre></div></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
