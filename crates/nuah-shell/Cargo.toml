[package]
name = "nuah-shell"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "The program that runs a product built on Nuah: reads a Profile, starts the Core and its services, stops them on SIGINT or SIGTERM."

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
nuah-kernel = { path = "../nuah-kernel" }
nuah-adapters = { path = "../nuah-adapters" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "signal", "time", "macros", "sync"] }

[dev-dependencies]
nuah-console = { path = "../nuah-console" }
nuah-http = { path = "../nuah-http" }
