[package]
name = "nuah-host"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "The program that runs a product built on Nuah: reads a Profile, starts the Core and its services, stops them on SIGINT or SIGTERM."

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
nuah-kernel = { path = "../nuah-kernel" }
nuah-adapters = { path = "../nuah-adapters" }
nuah-http = { path = "../nuah-http" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "signal", "time", "sync"] }
uuid = { version = "1.29.0", features = ["v4"] }
tower-http = { version = "0.7.1", features = ["fs"] }
