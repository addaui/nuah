[package]
name = "nuah-setup-web"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "First-run setup as a web wizard: a bootstrap for a product's host that writes the identity file."

[dependencies]
axum = "0.8.9"
nuah-kernel = { path = "../nuah-kernel" }
nuah-adapters = { path = "../nuah-adapters" }
nuah-shell = { path = "../nuah-shell" }
nuah-http = { path = "../nuah-http" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.29.0", features = ["v4"] }
